# Remember to give this permission to your workflows in repository settings: https://stackoverflow.com/a/72992289
name: Publish Library
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version Name (e.g. 1.0.3 or 1.0.3-SNAPSHOT)'
        required: true

permissions:
  contents: write

jobs:
  publish_library:
    name: Publish Library on Maven Central
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: Grant Permission to Execute Gradle
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run Tests
        run: ./gradlew :khealth:clean :khealth:test

      - name: Build Docs
        run: ./gradlew :khealth:dokkatooGenerate

      - name: Publish Docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: docs
          folder: khealth/build/dokka/html

      - name: Publish Library
        run: |
          echo "Publishing and Releasing library 🚀"
          ./gradlew publish --no-configuration-cache
          echo "Published and Released ✅"
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ github.event.inputs.versionName }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}

      - name: Create and push tag
        run: |
          git config --global user.email "shubhamsinghshubham777@gmail.com"
          git config --global user.name "$GITHUB_ACTOR"

          git tag -a $TAG -m "Release v$TAG"
          git push origin $TAG
        env:
          TAG: ${{ github.event.inputs.versionName }}

      - name: Create Release on GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.versionName }}
          name: ${{ github.event.inputs.versionName }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
