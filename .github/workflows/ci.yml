name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
      apple: ${{ steps.filter.outputs.apple }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - '.github/workflows/ci.yml'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'gradle.properties'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'khealth/build.gradle.kts'
              - 'khealth/gradle.properties'
              - 'khealth/src/commonMain/**'
              - 'khealth/src/androidMain/**'
              - 'khealth/src/androidHostTest/**'
              - 'sampleApps/android/**'
              - 'sampleApps/shared/**'
            apple:
              - '.github/workflows/ci.yml'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'gradle.properties'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'khealth/build.gradle.kts'
              - 'khealth/gradle.properties'
              - 'khealth/src/commonMain/**'
              - 'khealth/src/appleMain/**'
              - 'khealth/src/appleTest/**'
              - 'sampleApps/apple/**'
              - 'sampleApps/shared/**'
            docs:
              - '.github/workflows/ci.yml'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'gradle.properties'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'khealth/build.gradle.kts'
              - 'khealth/gradle.properties'
              - 'khealth/src/commonMain/**'
              - 'khealth/dokka_assets/**'
              - 'khealth/src/androidMain/**'
              - 'khealth/src/appleMain/**'

  android-common-checks:
    name: Android & Common Checks
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Host Unit Tests
        run: ./gradlew :khealth:testAndroidHostTest

      - name: Run Android Lint
        run: ./gradlew :khealth:lint

      - name: Assemble Android Sample App
        run: ./gradlew :sampleApps:android:assembleDebug

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'
          detailed_summary: true

  apple-checks:
    name: Apple Native Checks & Tests
    needs: changes
    if: ${{ needs.changes.outputs.apple == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run iOS Simulator Unit Tests
        run: ./gradlew :khealth:iosSimulatorArm64Test

      - name: Assemble Apple Shared Framework
        run: ./gradlew :sampleApps:shared:assemble

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'
          detailed_summary: true

  docs-check:
    name: Documentation Check
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Dokka Documentation
        run: ./gradlew :khealth:dokkatooGenerate

  ci-status:
    name: CI Status
    needs: [changes, android-common-checks, apple-checks, docs-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify build status
        run: |
          echo "Checking status of jobs..."
          echo "changes: ${{ needs.changes.result }}"
          echo "android-common-checks: ${{ needs.android-common-checks.result }}"
          echo "apple-checks: ${{ needs.apple-checks.result }}"
          echo "docs-check: ${{ needs.docs-check.result }}"

          if [[ "${{ needs.changes.result }}" == "failure" || \
                "${{ needs.android-common-checks.result }}" == "failure" || \
                "${{ needs.apple-checks.result }}" == "failure" || \
                "${{ needs.docs-check.result }}" == "failure" || \
                "${{ needs.changes.result }}" == "cancelled" || \
                "${{ needs.android-common-checks.result }}" == "cancelled" || \
                "${{ needs.apple-checks.result }}" == "cancelled" || \
                "${{ needs.docs-check.result }}" == "cancelled" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All jobs succeeded or were safely skipped."
