# Remember to give this permission to your workflows in repository settings: https://stackoverflow.com/a/72992289
name: Publish Library

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version Name (e.g. 2.1.0 or 2.1.0-SNAPSHOT)'
        required: true
      releaseNotes:
        description: 'Release notes or summary of changes (optional)'
        required: false
        type: string
      draft:
        description: 'Create release as a draft'
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-library:
    name: Publish Library to Maven Central
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if tag already exists
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' already exists on remote or locally! Aborting workflow to avoid accidental re-release or corrupting an existing release."
            exit 1
          fi
        env:
          TAG: ${{ github.event.inputs.versionName }}

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Distribute PGP Public Key
        env:
          SIGNING_KEY: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
        run: |
          which gpg >/dev/null 2>&1 || brew install gnupg
          if [ -n "$SIGNING_KEY" ]; then
            echo "Importing signing key into GPG..."
            echo "$SIGNING_KEY" | gpg --batch --import || true
            KEY_ID=$(gpg --list-keys --with-colons | grep '^pub:' | cut -d: -f5 | head -n 1)
            FINGERPRINT=$(gpg --list-keys --with-colons | grep '^fpr:' | cut -d: -f10 | head -n 1)
            if [ -n "$KEY_ID" ]; then
              echo "Key ID: $KEY_ID (Fingerprint: $FINGERPRINT)"
              gpg --list-keys "$KEY_ID"
              echo "Publishing public key to keys.openpgp.org..."
              gpg --batch --keyserver hkps://keys.openpgp.org --send-keys "$KEY_ID" || true
              echo "Publishing public key to keyserver.ubuntu.com..."
              gpg --batch --keyserver hkps://keyserver.ubuntu.com --send-keys "$KEY_ID" || true
              # Give keyservers a moment to register the key before Central validation
              sleep 5
            else
              echo "::warning::Could not determine GPG Key ID from signing key."
            fi
          else
            echo "::warning::ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY is empty or not set."
          fi

      - name: Publish Library
        run: |
          echo "Publishing and Releasing library 🚀"
          ./gradlew :khealth:publishAndReleaseToMavenCentral --no-configuration-cache
          echo "Published and Released ✅"
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ github.event.inputs.versionName }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}

      - name: Create and push tag
        run: |
          git config --global user.email "shubhamsinghshubham777@gmail.com"
          git config --global user.name "$GITHUB_ACTOR"

          git tag -a "$TAG" -m "Release v$TAG"
          git push origin "$TAG"
        env:
          TAG: ${{ github.event.inputs.versionName }}

      - name: Create Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.versionName }}
          name: ${{ github.event.inputs.versionName }}
          body: ${{ github.event.inputs.releaseNotes }}
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft == true || github.event.inputs.draft == 'true' }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docs:
    name: Build & Publish Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Docs
        run: ./gradlew :khealth:dokkaGeneratePublicationHtml

      - name: Publish Docs to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: docs
          folder: khealth/build/dokka/html
